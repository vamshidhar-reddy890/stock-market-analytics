# ========================================
# SERVER
# ========================================
server.port=${PORT:9090}

# ========================================
# MYSQL DATABASE
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stock_analytics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# APPLICATION
# ========================================
spring.application.name=stock-market-analytics

# ========================================
# TWELVEDATA API CONFIGURATION
# ========================================
twelvedata.base.url=https://api.twelvedata.com
twelvedata.api.key=${TWELVEDATA_API_KEY}

# ========================================
# JWT CONFIGURATION
# ========================================
jwt.secret=${JWT_SECRET}

# ========================================
# CORS CONFIGURATION
# ========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://YOUR-FRONTEND-NAME.onrender.com}
